# Default single-experiment config.
#
# Override on the command line:
#   uv run python -m hcoord dispatcher=hierarchical n_regions=3
#
# Sweep with --multirun:
#   uv run python -m hcoord --multirun \
#     dispatcher=monolithic,hierarchical fleet_size=20,40,80 intensity=1,2,4

seed: 11

# Network
network: synthetic         # "synthetic" | "memphis_osm"
n_outskirts: 25
osm_inner_km: 8.0
osm_outer_km: 40.0
osm_cache_dir: data/osm_cache

# Fleet
fleet_size: 30
capacity: 6
service_end_time: 1440.0   # minutes; one full day
placement: hubs            # "hubs" | "demand_proportional"

# Demand
intensity: 1.0
base_rate: 0.4
structural_zero_prob: 0.4
announce_lead_min: 90.0
arrival_buffer_min: 15.0

# Dispatcher
dispatcher: monolithic     # "monolithic" | "hierarchical"
n_regions: 5               # only used when dispatcher=hierarchical (1..5)
rebalance_interval_min: 30.0
forecast_lookahead_min: 60.0

# Learning data collection (LLP). When set, run dumps per-candidate features
# + ground-truth cost rows to this CSV path. Null = no collection.
collect_to: null

# Learned LLP plug-in. scorer_path null => heuristic LLP (exhaustive over
# candidates). When set, dispatcher uses the trained MLP scorer.
#   scorer_mode: "rank" | "filter" | "stacked"
#     rank    — top-K by predicted cost, exhaustive on top-K then fallback
#     filter  — drop confident-infeasibles, exhaustive on survivors
#     stacked — filter then top-K-by-cost on survivors (most aggressive)
#   scorer_top_k: K for rank/stacked modes
#   scorer_filter_logit_threshold: drop candidates with feasibility logit
#     below this. -4.0 ≈ keep unless P(feasible) < 1.8% (quality-preserving).
scorer_path: null
scorer_mode: rank
scorer_top_k: 3
scorer_filter_logit_threshold: -2.0

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}_${dispatcher}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    # `${hydra.job.num}` disambiguates runs whose only difference is a
    # scorer_path (heuristic vs learned LLP) — those don't collide now.
    subdir: ${hydra.job.num}_${dispatcher}_F${fleet_size}_I${intensity}_K${n_regions}_${placement}
  job:
    chdir: false
