[project]
name = "hcoord"
version = "0.1.0"
description = "Hierarchical decomposition for multi-modal DVRP — preliminary"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "hydra-core>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcoord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
